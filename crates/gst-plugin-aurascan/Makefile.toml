[tasks.build]
command = "cargo"
args = ["build", "--release", "--features", "vulkan,rocm,scrfd-embedded,sixdrepnet360-pretrained"]

[tasks.inspect-videocropscale]
dependencies = ["build"]
env = { GST_PLUGIN_PATH = "../../target/release", GST_DEBUG = "videocropscale:6" }
command = "gst-inspect-1.0"
args = ["videocropscale"]

[tasks.launch-headposeinferencebin]
dependencies = ["build"]
env = { GST_PLUGIN_PATH = "../../target/release", GST_DEBUG = "headposeinferencebin:6,scrfdtensordec:9" }
command = "gst-launch-1.0"
args = [
    "autovideosrc",
    "!", "video/x-raw,pixel-aspect-ratio=1/1",
    "!", "videoconvertscale",
    "!", "video/x-raw,format=RGB,width=640,height=384,pixel-aspect-ratio=1/1",
    "!", "headposeinferencebin", "scrfdinference::backend-type=rocm", "sixdrepnet360inference::backend-type=rocm",
    "!", "videoconvert",
    "!", "fpsdisplaysink", "sync=false",
]

[tasks.launch]
dependencies = ["build"]
env = { GST_PLUGIN_PATH = "../../target/release", GST_DEBUG = "videocropscale:6" }
command = "gst-launch-1.0"
args = [
    "autovideosrc",
    "!", "video/x-raw,pixel-aspect-ratio=1/1",
    "!", "videoconvertscale",
    "!", "video/x-raw,format=RGB,width=640,height=640,pixel-aspect-ratio=1/1",
    "!", "onnxinference", "execution-provider=cpu", "model-file=../../models/onnx/scrfd_500m.onnx",
    "!", "scrfdtensordec",
    "!", "bytetracker",
    "!", "faceselector",
    "!", "videocropscale",
    "!", "burn-sixdrepnet360inference",
    "!", "sixdrepnet360tensordec",
    "!", "videoconvert",
    "!", "fpsdisplaysink", "sync=false",
]

[tasks.launch-bytetracker]
dependencies = ["build"]
env = { GST_PLUGIN_PATH = "../../target/release", GST_DEBUG = "bytetracker:6" }
command = "gst-launch-1.0"
args = [
    "autovideosrc",
    "!", "video/x-raw,pixel-aspect-ratio=1/1",
    "!", "videoconvertscale",
    "!", "video/x-raw,format=RGB,width=640,height=640,pixel-aspect-ratio=1/1",
    "!", "onnxinference", "execution-provider=cpu", "model-file=../../models/onnx/scrfd_500m.onnx",
    "!", "scrfdtensordec",
    "!", "bytetracker",
    "!", "objectdetectionoverlay",
    "!", "videoconvert",
    "!", "fpsdisplaysink", "sync=false",
]

[tasks.launch-faceselector]
dependencies = ["build"]
env = { GST_PLUGIN_PATH = "../../target/release", GST_DEBUG = "faceselector:6" }
command = "gst-launch-1.0"
args = [
    "autovideosrc",
    "!", "video/x-raw,pixel-aspect-ratio=1/1",
    "!", "videoconvertscale",
    "!", "video/x-raw,format=RGB,width=640,height=640,pixel-aspect-ratio=1/1",
    "!", "onnxinference", "execution-provider=cpu", "model-file=../../models/onnx/scrfd_500m.onnx",
    "!", "scrfdtensordec",
    "!", "bytetracker",
    "!", "faceselector",
    "!", "videoconvert",
    "!", "fpsdisplaysink", "sync=false",
]
