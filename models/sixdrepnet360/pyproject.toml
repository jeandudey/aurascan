[project]
name = "sixdrepnet360"
version = "0.1.0"
description = "6DRepNet360"
authors = [
    { name = "Jean-Pierre De Jesus DIAZ", email = "me@jeandudey.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "onnx>=1.17.0",
    "onnxscript>=0.5.0",
    "torch>=2.9",
    "torchvision>=0.25.0",
]

[project.scripts]
sixdrepnet360-export = "sixdrepnet360.export:export"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
