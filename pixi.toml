[workspace]
authors = ["Jean-Pierre De Jesus DIAZ <me@jeandudey.tech>"]
channels = ["conda-forge"]
name = "aurascan"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]

[dependencies]
python = ">=3.14.7,<3.15"
gtk4 = ">=4.24.1,<5"
gstreamer = ">=1.28.7,<2"
libadwaita = ">=1.10.0,<2"
glib = ">=2.90.0,<3"
gst-plugins-base = ">=1.28.7,<2"
gst-plugins-bad = ">=1.28.7,<2"
gst-plugins-good = ">=1.28.7,<2"
gst-plugins-ugly = ">=1.28.7,<2"
hip-devel = ">=7.2.4,<8"
hip-runtime-amd = ">=7.2.4,<8"
hipcc = ">=7.2.4,<8"
pkg-config = ">=0.29.2,<0.30"
opencv = ">=5.0.0,<6"
libglib = ">=2.90.0,<3"
zlib = ">=1.3.2,<2"

[pypi-dependencies]
sixdrepnet360 = { git = "https://github.com/jeandudey/pytorch-sixdrepnet360/", branch = "master", extras = [
    "export",
] }
