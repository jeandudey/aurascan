[workspace]
authors = ["Jean-Pierre De Jesus DIAZ <me@jeandudey.tech>"]
channels = ["conda-forge"]
name = "aurascan"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[workspace.build-variants]
hip_compiler = ["hip-rocm-clang"]
hip_compiler_version = ["7.2"]

[tasks.update-girs]
description = "Copy GstHip-1.0.gir (not in the gir-files submodules) from the pixi prefix into girs/"
cmd = ["mkdir", "-p", "girs", "&&", "cp", "$CONDA_PREFIX/share/gir-1.0/GstHip-1.0.gir", "girs/"]

[tasks.generate-gstreamer-hip-sys]
description = "Regenerate crates/gstreamer-hip-sys from girs/ and re-apply the manual fixups"
depends-on = ["update-girs"]
cwd = "crates/gstreamer-hip-sys"
cmd = ["gir", "-c", "Gir.toml", "-o", ".", "&&", "git", "apply", "--whitespace=nowarn", "gir-fixups.patch"]

[tasks.generate-gstreamer-hip]
description = "Regenerate crates/gstreamer-hip from girs/"
depends-on = ["update-girs"]
cwd = "crates/gstreamer-hip"
cmd = ["gir", "-c", "Gir.toml", "-o", "."]

[tasks.generate-gir-bindings]
description = "Regenerate all GIR based bindings"
depends-on = ["generate-gstreamer-hip-sys", "generate-gstreamer-hip"]

[tasks.build]
cmd = "cargo build --release"

[tasks.export-scrfd]
cmd = [
    "scrfd-export", "scrfd_500m",
    "--snapshot", "models/scrfd_500m.pth",
    "--output", "models/scrfd_500m.onnx",
    "--opset", "18",
]

[tasks.export-sixdrepnet360]
cmd = [
    "sixdrepnet360-export",
    "--output", "models/sixdrepnet360.onnx",
    "--opset", "18",
]

[tasks.export]
depends-on = ["export-scrfd", "export-sixdrepnet360"]

[tasks.modelinfo-scrfd]
depends-on = ["export-scrfd"]
cmd = ["modelinfo-generator", "models/scrfd_500m.onnx"]

[tasks.modelinfo-sixdrepnet360]
depends-on = ["export-sixdrepnet360"]
cmd = ["modelinfo-generator", "models/sixdrepnet360.onnx"]

[tasks.models]
depends-on = ["modelinfo-scrfd", "modelinfo-sixdrepnet360"]

[tasks.appimage]
depends-on = ["build"]
cmd = [
    "linuxdeploy",
    "--appdir", "target/release/AppDir",
    "--executable", "target/release/aurascan",
    "--desktop-file", "data/tech.jeandudey.Aurascan.desktop",
    "--icon-file", "data/tech.jeandudey.Aurascan.svg",
    "--plugin", "gtk",
    "--output", "appimage",
]

[dependencies]
expat = ">=2.8.5,<3"
gtk4 = ">=4.24.1,<5"
gir = { path = "packages/gir" }
glib = ">=2.90.0,<3"
gstreamer = ">=1.28.7,<2"
gst-plugins-base = ">=1.28.7,<2"
gst-plugins-bad = ">=1.28.7,<2"
gst-plugins-good = ">=1.28.7,<2"
gst-plugins-ugly = ">=1.28.7,<2"
harfbuzz = ">=14.6.0,<15"
hip-devel = ">=7.2.4,<8"
# ############################################################################
# TEMPORARY WORKAROUND, REMOVE WHEN ROCm IS UPDATED
#
# `hip-runtime-amd` is built locally from packages/hip-runtime-amd instead of
# using conda-forge's 7.2.4 package, because that package has a HIP runtime bug
# (leaked amd::MemObjMap entries for GL interop buffers, fixed upstream in
# ROCm/rocm-systems 775707dbae, SWDEV-574221). It makes hipdownload's HIP to GL
# copy fail and produces green/garbled frames when previewing HIP memory with
# glimagesink.
#
# The fix is in TheRock >= 7.12 but not in any rocm-7.2.x release.
#
# TO REMOVE: once the ROCm packages (hip-devel, hipcc, ...) are updated to a
# release that contains 775707dbae:
#   1. replace the line below with `hip-runtime-amd = ">=X.Y.Z,<8"`,
#   2. delete packages/hip-runtime-amd/,
#   3. run `pixi install` to refresh pixi.lock.
# ############################################################################
hip-runtime-amd = { path = "packages/hip-runtime-amd" }
hipcc = ">=7.2.4,<8"
libadwaita = ">=1.10.0,<2"
libmatio = ">=1.5.6,<2"
linuxdeploy = { path = "packages/linuxdeploy" }
linuxdeploy-plugin-appimage = { path = "packages/linuxdeploy-plugin-appimage" }
linuxdeploy-plugin-gtk = { path = "packages/linuxdeploy-plugin-gtk" }
modelinfo-helper = { path = "packages/modelinfo-helper" }
opencv = ">=5.0.0,<6"
python = ">=3.14.7,<3.15"
rocjpeg = { path = "packages/rocjpeg" }
pkg-config = ">=0.29.2,<0.30"
libglib = ">=2.90.0,<3"
reuse = ">=6.2.0,<7"
rust = ">=1.98.1,<1.99"
sysroot_linux-64 = ">=2.39"
zlib = ">=1.3.2,<2"

[pypi-dependencies]
scrfd = { git = "https://github.com/jeandudey/pytorch-scrfd/", branch = "main", extras = [
    "export",
] }
sixdrepnet360 = { git = "https://github.com/jeandudey/pytorch-sixdrepnet360/", branch = "master", extras = [
    "export",
] }

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
